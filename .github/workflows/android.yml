name: Android CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: r0adkll/setup-android@v3
        with:
          platform-tools: true
          build-tools: "34.0.0"
          platform: "android-34"

      - name: 替换阿里云镜像加速依赖
        run: |
          sed -i 's|https://maven.google.com|https://maven.aliyun.com/repository/google|g' build.gradle
          sed -i 's|https://repo1.maven.org/maven2|https://maven.aliyun.com/repository/public|g' build.gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxOS2-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
